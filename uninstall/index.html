<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>We’re sorry to see you go — Chinese Dictionary</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230fb574'/%3E%3Ctext x='50' y='54' font-size='74' font-weight='800' text-anchor='middle' dominant-baseline='central' font-family='sans-serif'%3E%E4%B8%AD%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --jade-1:#1cb085;
    --gold:#ffda8c;
    --cream:#fcf8ee;
    --muted:#bfe3d7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(28,176,133,.45), transparent 60%),
      linear-gradient(160deg, #0b3b38 0%, #072a28 55%, #051f1d 100%);
    min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:44px 20px 72px}

  /* Brand */
  .brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:28px}
  .brand svg{width:38px;height:38px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.3);flex:none}
  .brand .name{font-size:21px;font-weight:800;line-height:1;
    background:linear-gradient(180deg,#ffe8ad 0%,#f3c965 58%,#e6af45 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}

  /* Hero */
  .hero{text-align:center;margin-bottom:26px}
  .wave{font-size:42px;line-height:1;margin-bottom:10px}
  .hero h1{font-size:34px;font-weight:800;line-height:1.15;margin-bottom:12px}
  .hero p{font-size:18px;color:var(--muted);max-width:460px;margin:0 auto}

  /* Form card */
  .card{
    background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .card iframe{display:block;width:100%;border:0}

  /* Placeholder shown until the real form embed URL is dropped in */
  .placeholder{
    padding:44px 26px;text-align:center;color:#5a6b66;
    font-size:15px;background:#fbfdfc;
  }
  .placeholder b{color:#0b3b38}

  /* Korean wraps by word, same as on the welcome page. */
  html[lang="ko"] .hero h1, html[lang="ko"] .hero p{word-break:keep-all}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#0fb574"/><text x="50" y="54" font-size="74" font-weight="800" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" fill="#fff">中</text></svg>
      <span class="name">Chinese Dictionary</span>
    </div>

    <div class="hero">
      <div class="wave">👋</div>
      <h1 data-i18n="title">We’re sorry to see you go</h1>
      <p data-i18n="sub">Mind telling us why you left? Even one line helps us make it better.</p>
    </div>

    <div class="card">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSdPXsCZog3L_e9ZAO5oBlkJ5DX25TY_-YhPOwVJ1VuMQZsCow/viewform?embedded=true&hl=en" id="form-frame"
        height="580"
        title="Why did you uninstall Chinese Dictionary?"
        loading="lazy">Loading…</iframe>
    </div>
  </div>
<script>
/* Page language: ?lang= -> navigator.language -> en. The embedded form follows the
   same language via its hl parameter, so the form UI never disagrees with the page.
   The form questions themselves stay in English — it is one form for everyone. */
(function () {
  'use strict';
  var T = {
    fr: {
      docTitle: 'Désolés de vous voir partir — Chinese Dictionary',
      title: 'Désolés de vous voir partir',
      sub: 'Pouvez-vous nous dire pourquoi ? Une seule ligne nous aiderait à nous améliorer.',
    },
    vi: {
      docTitle: 'Rất tiếc khi bạn rời đi — Chinese Dictionary',
      title: 'Rất tiếc khi bạn rời đi',
      sub: 'Bạn có thể cho biết lý do không? Một dòng thôi cũng giúp chúng tôi cải thiện.',
    },
    ko: {
      docTitle: '떠나신다니 아쉽습니다 — Chinese Dictionary',
      title: '떠나신다니 아쉽습니다',
      sub: '떠나신 이유를 알려주시겠어요? 한 줄이면 저희가 더 나아지는 데 큰 도움이 됩니다.',
    },
  };
  var q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
  var nav = (navigator.language || '').split('-')[0].toLowerCase();
  var lang = q === 'en' ? 'en' : (T[q] ? q : (T[nav] ? nav : 'en'));
  document.documentElement.lang = lang;
  var frame = document.getElementById('form-frame');
  if (frame && lang !== 'en') frame.src = frame.src.replace('hl=en', 'hl=' + lang);
  if (lang === 'en') return;
  var dict = T[lang];
  document.title = dict.docTitle;
  var nodes = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < nodes.length; i++) {
    var val = dict[nodes[i].getAttribute('data-i18n')];
    if (val !== undefined) nodes[i].textContent = val;
  }
})();
</script>
</body>
</html>
